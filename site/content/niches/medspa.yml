faq:
- q: С какого бюджета можно начинать?
  a: Бюджет зависит от города, конкуренции и загрузки клиники. На первой консультации разберём ваши цифры и предложу стартовую сумму, а увеличивать её будем только после того, как увидим записи.
- q: Что делать, если люди спрашивают цену и пропадают?
  a: Фильтруем аудиторию ещё на этапе объявления и даём готовые скрипты ответов для WhatsApp и Direct, чтобы вопрос «сколько стоит» превращался в запись.
- q: Нужны ли профессиональные съёмки?
  a: Не обязательно. Часто лучше работают живые фото и видео процесса и результатов. Я дам понятное ТЗ, что снять на телефон.
- q: Сколько моего времени это займёт?
  a: Настройку, аналитику и оптимизацию я беру на себя. От вас нужно вовремя отвечать на заявки. Раз в неделю присылаю отчёт с понятными цифрами.
