about_text: "I have been running targeted ads since 2018. I specialise in the beauty and wellness industry and in complex sales funnels. I don't just set up ads: I build a system that brings in money, not just clicks. I work in Russian and English with businesses in Israel, the US, Canada and Europe."
faq:
  - q: "What budget do I need to start?"
    a: "It depends on your city, competition and how busy your practice is. On the first call we'll go through your numbers and I'll suggest a starting amount; we only increase it once we see bookings."
  - q: "What if people ask for the price and disappear?"
    a: "We filter the audience at the ad stage and give you ready-made reply scripts for WhatsApp and Direct, so “how much is it?” turns into a booking."
  - q: "Do I need professional photo shoots?"
    a: "Not necessarily. Real photos and videos of the process and results often work better. I'll give you a clear brief on what to film on your phone."
  - q: "How much of my time will it take?"
    a: "I handle the setup, analytics and optimisation. You just need to reply to inquiries promptly. Once a week I send a report with clear numbers."
