about_text: "I have been running targeted ads since 2018. I specialise in the beauty and wellness industry and in complex sales funnels. I don't just set up ads: I build a system that brings in money, not just clicks. I work in Russian and English with businesses in Israel, the US, Canada and Europe."
faq:
  - q: "How can I be sure the ads will pay off?"
    a: "We don't just launch ads, we build a financial model. Before the start we look at the price of your session and the value of a client (LTV). Target costs per inquiry and per client go into the strategy, and we check results against them every week."
  - q: "What if people only ask for the price and disappear?"
    a: "That's a cold-traffic problem, and we solve it in two ways: we filter people at the ad stage, and we give you ready-made WhatsApp reply scripts that turn “how much is it?” into an actual booking."
  - q: "What ad budget do I need to start?"
    a: "To test and get your first 50–100 inquiries a month, $300 to $500 is usually enough, depending on your city and competition. We start small and increase the budget only when we see real money coming in."
  - q: "Do I need a perfect Instagram and professional shoots?"
    a: "No. Real photos of the process (the therapist's hands) and honest video reviews often work better. We'll give you a clear brief on what to film on your phone so the ads look natural and build trust."
  - q: "How much of my time will it take?"
    a: "We handle all the technical side: setup, analytics and optimisation. You or your administrator just need to reply to WhatsApp inquiries on time using our templates. Once a week we send a report with clear numbers."
  - q: "Why work with you rather than a regular ads freelancer?"
    a: "A regular freelancer sets up buttons. We bring a system built for massage businesses: we know the offers that work, how to lower the cost per inquiry, and how to turn a one-off client into a regular."
