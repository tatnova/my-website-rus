# Вопросы и ответы: страница /faq. На главной показываются только вопросы с отметкой «Показывать на главной».
# Темы: start — «Как начать работу», results — «Реклама и результат». В ответах можно ставить ссылки: [текст](/cases).
faq:
- topic: start
  show_on_home: false
  q: Как начать работу?
  a: 'Напишите мне в WhatsApp или Telegram: чем вы занимаетесь, в каком городе нужны клиенты и какая задача сейчас. Дальше разберём ситуацию и решим, с чего начать. Подробнее на странице [«Контакты»](/contact).'
- topic: start
  show_on_home: false
  q: С какими нишами вы работаете?
  a: 'Моя специализация — бьюти-индустрия: массаж и спа, косметология и перманентный макияж, салоны и парикмахерские, маникюр, фитнес, клиники и медспа.'
- topic: start
  show_on_home: false
  q: В каких странах вы работаете?
  a: 'Работаю с проектами в Европе, Америке и Азии. Реклама настраивается под язык, город и аудиторию конкретной страны.'
- topic: start
  show_on_home: false
  q: На каких площадках вы запускаете рекламу?
  a: 'Instagram, Facebook и TikTok. Площадку выбираем под вашу нишу и аудиторию.'
- topic: start
  show_on_home: false
  q: Где посмотреть результаты ваших клиентов?
  a: 'В разделе [«Кейсы»](/cases): по каждому проекту указаны бюджет, количество заявок, цена заявки и результат там, где эти данные есть. Отзывы клиентов собраны на странице [«Отзывы»](/reviews).'
- topic: results
  show_on_home: true
  q: Как понять, что реклама будет приносить прибыль?
  a: 'Перед запуском разбираем цифры: сколько стоит клиент, какая у него ценность и как работает воронка. Задача — не просто получить заявки, а выстроить систему, которая даёт прибыль.'
- topic: results
  show_on_home: true
  q: Можно ли увеличить поток клиентов и не потерять контроль?
  a: Да, если выстроена система. Когда есть CRM, понятная обработка заявок и настроенные процессы, можно увеличивать поток без перегрузки команды.
- topic: results
  show_on_home: true
  q: Что делать, если заявки есть, но записи слабые?
  a: Это вопрос не рекламы, а воронки и обработки. Разбираем, где теряются клиенты, и настраиваем систему так, чтобы заявки превращались в записи.
- topic: results
  show_on_home: true
  q: Нужно ли переделывать всё с нуля?
  a: В большинстве случаев нет. Сначала смотрим, что уже работает, и усиливаем это. Только потом принимаем решение о перестройке.
- topic: results
  show_on_home: true
  q: Как сделать поток клиентов стабильным, а не от запуска к запуску?
  a: 'За счёт системы: постоянная реклама, понятная обработка заявок и учёт записей и продаж. Сайт, CRM или автоматизацию подключаем, если они нужны проекту. Тогда заявки идут регулярно, а не только после запуска рекламы.'
- topic: results
  show_on_home: true
  q: Сколько времени нужно, чтобы увидеть первые результаты?
  a: 'Это зависит от ниши, текущей ситуации и воронки, но первые сигналы обычно видны уже в начале работы: по стоимости заявки, качеству лидов, скорости обработки и первым записям.'
- topic: results
  show_on_home: true
  q: Подходит ли это только для салонов красоты?
  a: Нет. Я работаю не только с салонами красоты, но и с мастерами, бьюти-экспертами, студиями и другими нишами, где важна система привлечения клиентов.
- topic: results
  show_on_home: true
  q: Вы работаете только с рекламой или помогаете шире?
  a: Работа не ограничивается запуском рекламы. При необходимости подключаю сайт, посадочные страницы, CRM, автоматизацию, аналитику и логику обработки заявок.
- topic: results
  show_on_home: true
  q: Что если у меня уже есть реклама, но результат нестабильный?
  a: 'Тогда задача не просто “перезапустить рекламу”, а понять, где именно теряются деньги: в оффере, в креативах, в посадочной странице, в CRM или в обработке лидов.'
- topic: results
  show_on_home: true
  q: Можно ли масштабироваться без хаоса?
  a: 'Да. Масштабирование возможно тогда, когда уже есть система: понятный путь клиента, контроль заявок, регулярная аналитика и автоматизация ключевых этапов.'
