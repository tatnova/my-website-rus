# Услуги: страница /services и блок «Услуги» на главной.
# «Что входит» показывается только на странице /services.
services:
- title: 1. Аудит и стратегия
  text: 'Разбираю текущую ситуацию: рекламу, воронку, обработку заявок. Показываю, где теряются клиенты и что нужно изменить, чтобы увеличить поток заявок и прибыль.'
  includes:
  - Разбор рекламного кабинета и объявлений
  - Проверка пути клиента от объявления до записи
  - Разбор того, как обрабатываются заявки
  - План изменений по шагам
  featured: false
- title: 2. Запуск рекламы
  text: Настраиваю рекламу под твою нишу с учётом продукта, аудитории и воронки. Подключаю сайты, посадочные страницы и подготавливаю всё для запуска.
  includes:
  - Реклама в Instagram, Facebook и TikTok
  - Аудитории под ваш город и услугу
  - Тексты и задание на фото и видео для объявлений
  - Подключение сайта или посадочной страницы
  featured: false
- title: 3. Система привлечения клиентов
  text: 'Выстраиваю связку: реклама + сайт + CRM + автоматизация. Чтобы заявки не терялись, обрабатывались и превращались в клиентов.'
  includes:
  - Реклама и посадочная страница
  - CRM, где видна каждая заявка
  - Автоматизация обработки заявок
  - Аналитика от объявления до записи
  featured: true
- title: 4. Сопровождение и масштабирование
  text: Веду рекламу, оптимизирую показатели и помогаю масштабировать результат без роста хаоса и потерь.
  includes:
  - Ведение и оптимизация рекламы
  - Новые объявления и аудитории
  - Регулярные отчёты с цифрами
  - Масштабирование того, что уже приносит записи
  featured: false
