# Переадресации со старых адресов WordPress (adsnew.org) на новые страницы.
# Адреса кейсов и статей сюда не пишутся: они берутся из поля «Старые адреса» (old_urls) в самом кейсе или статье.
# from — старый путь; «/*» в конце означает «этот путь и всё, что под ним».
redirects:
  - { from: "/услуги/", to: "/services" }
  - { from: "/свяжитесь-с-нами/", to: "/contact" }
  - { from: "/возможности-для-партнерства-и-сотруд/", to: "/contact" }
  - { from: "/category/cases/*", to: "/cases" }
  - { from: "/category/*", to: "/cases" }
  - { from: "/tag/*", to: "/cases" }
  - { from: "/2023/*", to: "/cases" }
  - { from: "/2024/*", to: "/cases" }
  - { from: "/2025/*", to: "/cases" }
  - { from: "/2026/*", to: "/cases" }
  - { from: "/blog-feed.xml", to: "/blog" }
  - { from: "/feed/*", to: "/blog" }
  - { from: "/author/*", to: "/about" }
